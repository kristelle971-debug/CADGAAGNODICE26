<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatia CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : barre latérale violette + espace de travail, fiches détaillées en tiroir à droite, formulaires en fenêtres */
  --blue:#247091; --green:#45967C; --violet:#484596;
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#edf2f6; --line:#dbe3ea; --ink:#16232c; --muted:#5b6f7d;
  --accent:#247091; --accent-soft:#e2eef4; --green-soft:#e1f0eb; --violet-soft:#e8e7f5;
  --ok:#2c8459; --ok-soft:#e1f2e8; --warn:#a8691a; --warn-soft:#fbefd9; --bad:#bb3a2c; --bad-soft:#fae4e0;
  --side:#484596; --side-ink:#ffffff;
  --shadow:0 1px 2px rgba(22,35,44,.05),0 4px 14px rgba(22,35,44,.06);
  --display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e161b; --surface:#152128; --surface-2:#1b2a32; --line:#283a44; --ink:#e3ecf1; --muted:#93a7b4;
    --accent:#5aaed2; --accent-soft:#183342; --green-soft:#16302a; --violet-soft:#24233e;
    --ok:#62c494; --ok-soft:#14301f; --warn:#e3ab52; --warn-soft:#33270f; --bad:#f07d6e; --bad-soft:#391c18;
    --side:#2b2a5e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161b; --surface:#152128; --surface-2:#1b2a32; --line:#283a44; --ink:#e3ecf1; --muted:#93a7b4;
  --accent:#5aaed2; --accent-soft:#183342; --green-soft:#16302a; --violet-soft:#24233e;
  --ok:#62c494; --ok-soft:#14301f; --warn:#e3ab52; --warn-soft:#33270f; --bad:#f07d6e; --bad-soft:#391c18;
  --side:#2b2a5e; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0}
small{font-size:12px}
.muted{color:var(--muted)} .nowrap{white-space:nowrap} .sp{flex:1}
.late{color:var(--bad)!important;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Structure */
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:2px;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.brand b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}
.brand small{opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;padding:12px 10px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:rgba(255,255,255,.84);text-decoration:none;font-weight:600;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a.on{background:rgba(255,255,255,.18);color:#fff}
.nav .badge{margin-left:auto;background:var(--green);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:800;line-height:18px}
.nav .badge.bad{background:#d9543f}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:11.5px;opacity:.7;line-height:1.45}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.top .menu-btn{display:none}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;padding-left:34px}
.gsearch>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:360px;overflow-y:auto;padding:6px}
.gres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);text-decoration:none}
.gres a:hover,.gres a:focus{background:var(--surface-2)}
.gres .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-left:auto}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.me span.n{font-weight:700;font-size:13px}
.content{flex:1;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:16px}
.foot{margin-top:auto;padding-top:12px;font-size:11.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}

/* Charte : bandeaux verts, encadrés à bordure bleue */
.banner{background:var(--green);color:#fff;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow)}
.banner h1{font-size:22px;font-weight:700}
.banner p{margin:2px 0 0;opacity:.92}
.banner .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.banner .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.banner .btn:hover{background:rgba(255,255,255,.24)}
.banner .btn.primary{background:#fff;color:#2c6b57;border-color:#fff}
.help{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--muted);box-shadow:var(--shadow)}
.help svg{color:var(--blue);margin-top:2px}
.help b{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:15px}
.pad{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.ibtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:inherit}
.ibtn:hover{background:var(--surface-2)}
.ibtn.sm{width:26px;height:26px;border-radius:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar.flat{border:0;padding:0}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:600}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sw{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;color:var(--muted);font-size:13px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Tableaux */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:800}
.tbl th[data-act]{cursor:pointer;user-select:none}
.tbl th[data-act]:hover{color:var(--ink)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right}
.tbl tr.empty td{text-align:center;color:var(--muted);padding:28px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;white-space:nowrap}
.who small{color:var(--muted);display:block}

/* Pastilles */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap;background:var(--surface-2);color:var(--muted);line-height:18px}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.violet{background:var(--violet-soft);color:#6f6cc4}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c,#247091);color:#fff;font-size:11px;font-weight:800;flex:none;letter-spacing:.02em}
.av.lg{width:48px;height:48px;font-size:16px}
.uname{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}

/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--kc,var(--blue));border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .s{color:var(--muted);font-size:12.5px}
.plist{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface-2)}
.prow b{display:block}
.prow small{color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.empty-m{padding:22px 16px;color:var(--muted);text-align:center}

/* Barres */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-r{display:grid;grid-template-columns:minmax(110px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar-f{height:100%;border-radius:999px;min-width:3px}
.bar-v{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
.bar-v small{color:var(--muted);font-weight:600}
.vbars{display:flex;gap:10px;align-items:flex-end;height:220px;padding-top:6px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.vb-t{flex:1;width:100%;max-width:56px;display:flex;align-items:flex-end;background:linear-gradient(to top,var(--line) 1px,transparent 1px) 0 0/100% 25%}
.vb-f{width:100%;background:var(--green);border-radius:6px 6px 0 0;min-height:2px}
.vb.cur .vb-f{background:var(--blue)}
.vb-v{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.vb-l{font-size:12px;color:var(--muted);text-transform:capitalize}

/* Pipeline */
.board{display:grid;grid-template-columns:repeat(6,minmax(232px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.col-h{padding:10px 12px;border-top:4px solid var(--sc);border-radius:12px 12px 0 0;display:flex;justify-content:space-between;gap:8px;background:var(--surface);border-bottom:1px solid var(--line)}
.col-h b{display:block;font-size:13.5px}
.col-h small{color:var(--muted)}
.col-n{text-align:right;font-variant-numeric:tabular-nums}
.col-n span{font-weight:800;display:block}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px;border-radius:0 0 12px 12px;transition:background .15s}
.col-b.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-4px}
.col-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:18px 6px}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.dcard.dragging{opacity:.45}
.dc-t{font-weight:800;line-height:1.3}
.dc-s{color:var(--muted);font-size:12.5px}
.dc-f{display:flex;align-items:center;gap:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.dc-f b{font-size:14px}
.dc-f span{display:inline-flex;gap:4px;align-items:center;margin-left:auto}
.dc-m{display:flex;justify-content:space-between}
.dc-m .ibtn{border:1px solid var(--line)}

/* Activités */
.act{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act.done .act-t{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;color:#fff}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green)}
.aico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--tc-soft);color:var(--tc)}
.t-appel{--tc:var(--blue);--tc-soft:var(--accent-soft)}
.t-email{--tc:#6f6cc4;--tc-soft:var(--violet-soft)}
.t-rdv{--tc:var(--green);--tc-soft:var(--green-soft)}
.t-tache{--tc:var(--warn);--tc-soft:var(--warn-soft)}
.t-note{--tc:var(--muted);--tc-soft:var(--surface-2)}
.t-log{--tc:var(--muted);--tc-soft:transparent}
.act-m{flex:1;min-width:0;cursor:pointer}
.act-t{font-weight:700}
.act-s{color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp-h{padding:8px 16px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.grp-h.bad{color:var(--bad);background:var(--bad-soft)}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;padding:12px;overflow-x:auto}
.wday{background:var(--surface-2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:180px}
.wday.today{outline:2px solid var(--blue)}
.wd-h{font-weight:800;font-size:12.5px;text-transform:capitalize;color:var(--muted)}
.wday.today .wd-h{color:var(--blue)}
.wev{background:var(--surface);border-left:3px solid var(--tc);border-radius:6px;padding:5px 7px;font-size:12px;cursor:pointer;line-height:1.35}
.wev.done{opacity:.55;text-decoration:line-through}
.wadd{margin-top:auto;border:1px dashed var(--line);background:transparent;border-radius:6px;color:var(--muted);padding:2px}
.wadd:hover{color:var(--blue);border-color:var(--blue)}

/* Tiroir de fiche */
.shade{position:fixed;inset:0;background:rgba(8,18,24,.35);z-index:39}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);box-shadow:-10px 0 34px rgba(0,0,0,.2);z-index:40;overflow-y:auto;display:flex;flex-direction:column}
.dh{background:var(--surface);padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative;display:flex;flex-direction:column;gap:12px}
.dclose{position:absolute;top:10px;right:10px}
.dh-id{display:flex;gap:14px;align-items:center;padding-right:36px}
.dh-k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--green)}
.dh h2{font-size:20px}
.dh-s{color:var(--muted)}
.dh-chips{display:flex;gap:6px;flex-wrap:wrap}
.qacts{display:flex;gap:6px;flex-wrap:wrap}
.qacts .btn{flex:1 1 auto;justify-content:center}
.dbody{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.dsec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;overflow:hidden}
.dsec>h4{font-size:13.5px;padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dsec>h4 .btn{margin-left:auto}
.dsec .pad{padding:12px 14px}
.dl{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 12px;margin:0;padding:12px 14px}
.dl dt{color:var(--muted);font-size:12.5px;font-weight:700}
.dl dd{margin:0;word-break:break-word}
.lnk{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px}
.stepper{display:flex;gap:4px;padding:12px 14px;flex-wrap:wrap}
.stepper button{flex:1 1 90px;border:0;padding:7px 6px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);border-radius:6px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}
.stepper button.past{background:var(--green-soft);color:var(--green)}
.stepper button.cur{background:var(--green);color:#fff}
.stepper button.lost{background:var(--bad);color:#fff}
.stepper button:hover:not(.cur){filter:brightness(.95)}
.big-amt{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tl{padding:12px 14px;display:flex;flex-direction:column}
.tl-i{display:flex;gap:10px;position:relative;padding-bottom:14px;cursor:pointer}
.tl-i:last-child{padding-bottom:0}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:2px;width:2px;background:var(--line)}
.tl-i .aico{width:30px;height:30px;border-radius:50%}
.tl-t{font-weight:700}
.tl-s{color:var(--muted);font-size:12px}
.tl-d{margin-top:4px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.t-log .tl-t{font-weight:600;color:var(--muted)}
.mini{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.mini:last-child{border-bottom:0}
.mini:hover{background:var(--surface-2)}
.mini b{display:block}
.mini small{color:var(--muted)}

/* Fenêtres */

.dlg-b{padding:16px 18px;overflow-y:auto}

.fgrid.q3{grid-template-columns:repeat(3,1fr)}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.field label i{color:var(--bad);font-style:normal}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%}
.field.full{grid-column:1/-1}
.field.cb label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:600;font-size:13.5px;margin:0;cursor:pointer}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.mfoot{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.info{background:var(--accent-soft);color:var(--accent)}
.qlines input,.qlines select{width:100%;padding:6px 8px}
.qlines td{padding:6px 6px}
.qlines th{padding:8px 6px}
.qlines td.num{white-space:nowrap;font-weight:700}
.qtot{margin:12px 0 0 auto;width:min(300px,100%);display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.qtot div{display:flex;justify-content:space-between;padding:4px 10px}
.qtot .ttc{background:var(--blue);color:#fff;border-radius:8px;padding:8px 10px;font-size:15px}

.paper .pb{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.paper .box{border-left:4px solid #247091;background:#f3f7f9;padding:10px 12px;border-radius:6px}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#45967C;color:#fff;padding:7px 8px;text-align:left;font-size:12px}
.paper td{padding:7px 8px;border-bottom:1px solid #e3e9ee}
.paper .num{text-align:right}
.paper .qtot .ttc{background:#247091}

/* Paramètres */
.set-row{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block}
.set-row small{color:var(--muted);display:block;font-size:12.5px}
.set-row .ctl{margin-left:auto;flex:none}
.toggle{position:relative;width:42px;height:24px;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s;cursor:pointer}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span::after{transform:translateX(18px)}
.toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.zap{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--violet-soft);color:#6f6cc4;flex:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.qmenu{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);padding:6px;width:230px}
.qmenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;font-weight:700;text-align:left}
.qmenu button:hover{background:var(--surface-2)}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(460px,calc(100% - 24px));pointer-events:none}
.toast{background:#16232c;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;font-weight:600;width:100%;animation:tin .2s ease-out}
.toast.ok svg{color:#7fd6a8} .toast.bad svg{color:#ff9d8f} .toast.auto{background:#484596}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.csv{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

@media (max-width:900px){

  .bar-r{grid-template-columns:96px 1fr auto}
}

function logSys(subject,ctx){D.activities.push({id:uid('a'),type:'log',subject,date:nowISO(),done:true,contactId:ctx.contactId||'',companyId:ctx.companyId||'',dealId:ctx.dealId||'',ticketId:ctx.ticketId||'',ownerId:D.settings.currentUser,description:''});}
function commit(){save();renderView();renderDrawer();}

/* ---------- Fenêtres ---------- */
function openModal(title,html,size){$('#mtitle').textContent=title;$('#mbody').innerHTML=html;$('#mdlg').className='dlg'+(size?' '+size:'');$('#modal').hidden=false;const f=$('#mbody input:not([type=hidden]):not([readonly]),#mbody select,#mbody textarea');if(f&&window.innerWidth>700)setTimeout(()=>{try{f.focus();}catch(e){}},30);}
function closeModal(){$('#modal').hidden=true;$('#mbody').innerHTML='';}
function confirmDlg(msg,yes,label='Confirmer'){$('#cmsg').textContent=msg;$('#cyes').textContent=label;$('#confirm').hidden=false;$('#cyes').onclick=()=>{$('#confirm').hidden=true;yes();};$('#cno').onclick=()=>{$('#confirm').hidden=true;};$('#cyes').focus();}
function showMsg(html,kind='bad'){const m=$('#fmsg');if(m)m.innerHTML=`<div class="msg ${kind}">${html}</div>`;}

function fieldHTML(f,val){
 const id='f_'+f.k, req=f.req?' <i>*</i>':'', cls='field'+(f.full||f.type==='textarea'?' full':'')+(f.type==='checkbox'?' cb':'');
 const v=val??(f.def??'');
 if(f.type==='checkbox')return `<div class="${cls}"><label for="${id}"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(f.label)}</label>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
 let input;
 if(f.type==='select'){input=`<select id="${id}">${f.empty!==undefined?`<option value="">${esc(f.empty)}</option>`:''}${(typeof f.options==='function'?f.options():f.options).map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;}
 else if(f.type==='textarea')input=`<textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
 else input=`<input id="${id}" type="${f.type||'text'}" value="${esc(Array.isArray(v)?v.join(', '):v)}" ${f.list?`list="${id}_l"`:''} placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''}>${f.list?`<datalist id="${id}_l">${f.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
 return `<div class="${cls}"><label for="${id}">${esc(f.label)}${req}</label>${input}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function readForm(fields){const v={};fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;if(f.type==='checkbox')v[f.k]=el.checked;else if(f.type==='number')v[f.k]=el.value===''?'':Number(el.value);else if(f.type==='tags')v[f.k]=el.value.split(',').map(s=>s.trim()).filter(Boolean);else v[f.k]=el.value.trim();});return v;}
function openForm(o){
 const html=`<form id="mform" novalidate><div class="fgrid">${o.fields.map(f=>fieldHTML(f,(o.values||{})[f.k])).join('')}</div>${o.note?`<div class="msg info">${ico('info',16)}<span>${o.note}</span></div>`:''}<div id="fmsg"></div><div class="mfoot">${o.onDelete?`<button type="button" class="btn danger" id="fdel">${ico('trash',16)}Supprimer</button>`:''}<span class="sp"></span><button type="button" class="btn ghost" data-act="closeModal">Annuler</button><button type="submit" class="btn primary">${esc(o.submit||'Enregistrer')}</button></div></form>`;
 openModal(o.title,html);
 const form=$('#mform');
 form.onsubmit=e=>{e.preventDefault();const vals=readForm(o.fields);const miss=o.fields.filter(f=>f.req&&(vals[f.k]===''||vals[f.k]==null));if(miss.length){showMsg(`${ico('alert',16)}<span>À compléter : ${miss.map(f=>esc(f.label)).join(', ')}.</span>`);const el=document.getElementById('f_'+miss[0].k);if(el)el.focus();return;}const r=o.onSubmit(vals);if(r!==false){closeModal();commit();}};
 if(o.onDelete)$('#fdel').onclick=()=>confirmDlg(o.deleteMsg||'Supprimer définitivement cet élément ?',()=>{o.onDelete();closeModal();commit();},'Supprimer');
 if(o.after)o.after(form);
}

function applyStage(d,k){
 const from=stage(d.stage).l;d.stage=k;d.probability=stage(k).p;
 if(k==='gagne'||k==='perdu')d.closeDate=day(0);
 if(k!=='perdu')d.lostReason='';
 logSys(`Étape : ${from} → ${stage(k).l}`,{dealId:d.id,contactId:d.contactId,companyId:d.companyId});
 if(k==='gagne'){toast(`Affaire gagnée : ${d.title} (${eur(d.amount)})`);const c=ct(d.contactId);if(D.settings.automations.wonClient&&c&&c.status!=='Client'){c.status='Client';logSys('Statut : passage en Client (opportunité gagnée)',{contactId:c.id,companyId:c.companyId});autoToast(`${fullName(c)} passe en « Client ».`);}}
}
function setStage(d,k){if(!d||d.stage===k)return;if(k==='perdu')return lostForm(d);applyStage(d,k);commit();}

function compose(ctx){
 const c=ct(ctx.contact);if(!c)return;
 if(!c.email){toast('Ce contact n\'a pas d\'adresse email : complétez sa fiche.','bad');return;}
 const t=ctx.ticket?tk(ctx.ticket):null;
 const fill=s=>s.replace(/\{(\w+)\}/g,(m,k)=>({civilite:c.civ==='M.'?'Monsieur':'Madame',prenom:c.firstName,nom:c.lastName,entreprise:co(c.companyId)?.name||'',commercial:me().name,ticket:t?t.number:'[référence]',objet:t?t.subject:''}[k]??m));
 const start=t?'sav':(ctx.deal?'relance':'contact');
 openModal(`Email à ${fullName(c)}`,`<div class="fgrid">
  <div class="field"><label for="m_to">Destinataire</label><input id="m_to" value="${esc(fullName(c))} <${esc(c.email)}>" readonly></div>
  <div class="field"><label for="m_tpl">Modèle d'email</label><select id="m_tpl">${TEMPLATES.map(x=>`<option value="${x.k}" ${x.k===start?'selected':''}>${esc(x.l)}</option>`).join('')}</select></div>
  <div class="field full"><label for="m_sub">Objet</label><input id="m_sub"></div>
  <div class="field full"><label for="m_body">Message</label><textarea id="m_body" rows="11"></textarea></div></div>
  <div id="m_warn"></div>
  <div class="msg info">${ico('info',16)}<span>Simulation : aucun email n'est réellement envoyé. Le message est enregistré dans l'historique du contact, comme dans un vrai CRM.</span></div>
  <div class="mfoot"><button type="button" class="btn ghost" data-act="closeModal">Annuler</button><button type="button" class="btn primary" id="m_send">${ico('mail',16)}Envoyer (simulation)</button></div>`);
 const apply=()=>{const x=TEMPLATES.find(y=>y.k===$('#m_tpl').value);$('#m_sub').value=fill(x.s);$('#m_body').value=fill(x.b);$('#m_warn').innerHTML=x.com&&!c.consent?`<div class="msg warn">${ico('alert',16)}<span>Attention : ce contact n'a pas donné son consentement RGPD pour recevoir des communications commerciales.</span></div>`:'';};
 $('#m_tpl').onchange=apply;apply();
 $('#m_send').onclick=()=>{const sub=$('#m_sub').value.trim();if(!sub){$('#m_sub').focus();return;}D.activities.push({id:uid('a'),type:'email',subject:`Email envoyé : ${sub}`,date:nowISO(),done:true,contactId:c.id,companyId:c.companyId,dealId:ctx.deal||'',ticketId:ctx.ticket||'',ownerId:D.settings.currentUser,description:$('#m_body').value});if(t&&t.status==='Nouveau'){t.status='En cours';logSys(`Ticket ${t.number} : Nouveau → En cours`,{ticketId:t.id,contactId:c.id,companyId:c.companyId});}closeModal();commit();toast('Email enregistré dans l\'historique (simulation)');};
}

 function readHead(){if(mode!=='edit')return;q.companyId=$('#q_company').value;q.contactId=$('#q_contact').value;q.dealId=$('#q_deal').value;q.date=$('#q_date').value||day(0);q.validity=+$('#q_validity').value||30;q.status=$('#q_status').value;q.notes=$('#q_notes').value;q.syncDeal=$('#q_sync').checked;}
 function totals(){const T=qTotals(q);q.lines.forEach((l,i)=>{const e=$('#lt'+i);if(e)e.textContent=eur(lineHT(l),1);});$('#q_ht').textContent=eur(T.ht,1);$('#q_tva').textContent=eur(T.tva,1);$('#q_ttc').textContent=eur(T.ttc,1);}

  }else{$('#q_back').onclick=()=>{mode='edit';draw();};$('#q_save2').onclick=doSave;}
 }
 function doSave(){
  readHead();

  if(!lines.length){if(mode!=='edit'){mode='edit';draw();}showMsg(`${ico('alert',16)}<span>Ajoutez au moins une ligne avec une désignation.</span>`);return;}
  q.lines=lines;
  const prev=ex?ex.status:null;let target;

  const d=deal(target.dealId);
  if(d&&target.syncDeal)d.amount=Math.round(qTotals(target).ht);

function csvCell(v){v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){
 const rows=S.lastContacts||D.contacts;
 const head=['Civilité','Prénom','Nom','Fonction','Entreprise','Email','Téléphone','Mobile','Statut','Origine','Étiquettes','Consentement RGPD','Suivi par'];
 const csv=[head.join(';')].concat(rows.map(c=>[c.civ,c.firstName,c.lastName,c.jobTitle,co(c.companyId)?.name||'',c.email,c.phone,c.mobile,c.status,c.source,(c.tags||[]).join(', '),c.consent?'Oui':'Non',user(c.ownerId)?.name||''].map(csvCell).join(';'))).join('\n');
 openModal('Exporter les contacts',`<p style="margin-top:0">${plural(rows.length,'contact')} (selon les filtres en cours). Copiez le texte puis collez-le dans Excel ou Google Sheets : les colonnes se séparent automatiquement.</p><textarea class="csv" id="csvOut" rows="12" readonly>${esc(csv)}</textarea><div class="mfoot"><button class="btn ghost" data-act="closeModal">Fermer</button><button class="btn primary" data-act="copy" data-src="csvOut">${ico('copy',16)}Copier</button></div>`,'wide');
}
function parseCSV(text){
 const first=text.split(/\r?\n/)[0]||'';const sep=first.includes(';')?';':first.includes('\t')?'\t':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur='';}else cur+=ch;}
 if(cur||row.length){row.push(cur);rows.push(row);}
 return rows.filter(r=>r.some(x=>x.trim()));
}
function importCSV(){
 const tpl='Civilité;Prénom;Nom;Fonction;Entreprise;Email;Téléphone;Mobile;Statut;Origine\nMme;Lucie;Bernard;Assistante commerciale;Boutique Les Arcades;l.bernard@lesarcades.fr;01 45 22 33 44;;Prospect;Salon professionnel';
 openModal('Importer des contacts',`<p style="margin-top:0">Importez une liste depuis un fichier <b>.csv</b> (enregistré depuis Excel) ou collez directement les lignes copiées depuis un tableur. La première ligne doit contenir les titres de colonnes.</p>
 <div class="msg info">${ico('info',16)}<span>Colonnes reconnues : Civilité, Prénom, Nom, Fonction, Entreprise, Email, Téléphone, Mobile, Statut, Origine. Les entreprises inconnues sont créées, les emails déjà présents sont ignorés (doublons).</span></div>

 <div class="field full"><label for="csvIn">Ou collez les données ici</label><textarea class="csv" id="csvIn" rows="8" placeholder="${esc(tpl)}"></textarea></div></div>
 <div id="fmsg"></div>
 <div class="mfoot"><button class="btn" id="csvTpl">${ico('copy',16)}Insérer un exemple</button><span class="sp"></span><button class="btn ghost" data-act="closeModal">Annuler</button><button class="btn primary" id="csvGo">${ico('upload',16)}Importer</button></div>`,'wide');
 $('#csvTpl').onclick=()=>{$('#csvIn').value=tpl;};
 $('#csvFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csvIn').value=String(r.result);};r.readAsText(f,'utf-8');};
 $('#csvGo').onclick=()=>{
  const rows=parseCSV($('#csvIn').value.trim());
  if(rows.length<2){showMsg(`${ico('alert',16)}<span>Aucune donnée à importer : il faut une ligne de titres puis au moins une ligne de contact.</span>`);return;}
  const H=rows[0].map(h=>norm(h).replace(/[^a-z]/g,''));
  const idx=keys=>H.findIndex(h=>keys.includes(h));
  const m={civ:idx(['civilite','civ']),fn:idx(['prenom','firstname']),ln:idx(['nom','lastname','name']),job:idx(['fonction','poste','jobtitle']),comp:idx(['entreprise','societe','company','organisation']),email:idx(['email','mail','courriel','adresseemail']),phone:idx(['telephone','tel','phone','telephonefixe']),mob:idx(['mobile','portable','gsm']),st:idx(['statut','status']),src:idx(['origine','source'])};
  if(m.ln<0){showMsg(`${ico('alert',16)}<span>Colonne « Nom » introuvable dans la première ligne.</span>`);return;}
  let ok=0,dup=0,bad=0;const g=(r,i)=>i>=0?(r[i]||'').trim():'';
  rows.slice(1).forEach(r=>{const ln=g(r,m.ln);if(!ln){bad++;return;}const email=g(r,m.email);
   if(email&&D.contacts.some(c=>norm(c.email)===norm(email))){dup++;return;}
   let cid='';const cn=g(r,m.comp);if(cn){let c=D.companies.find(x=>norm(x.name)===norm(cn));if(!c){c={id:uid('co'),name:cn,sector:'',address:'',postalCode:'',city:'',phone:'',email:'',website:'',siret:'',size:'',ownerId:D.settings.currentUser,notes:'',createdAt:day(0)};D.companies.push(c);}cid=c.id;}
   const st=CONTACT_STATUS.find(s=>norm(s)===norm(g(r,m.st)))||'Prospect';const src=SOURCES.find(s=>norm(s)===norm(g(r,m.src)))||'';
   const cv=norm(g(r,m.civ));
   D.contacts.push({id:uid('ct'),civ:cv.startsWith('m.')||cv==='m'||cv.startsWith('monsieur')?'M.':'Mme',firstName:g(r,m.fn),lastName:ln,jobTitle:g(r,m.job),companyId:cid,email,phone:g(r,m.phone),mobile:g(r,m.mob),status:st,source:src,ownerId:D.settings.currentUser,tags:['Import'],consent:false,notes:'',createdAt:day(0)});ok++;});
  closeModal();commit();toast(`${plural(ok,'contact importé','contacts importés')}${dup?` · ${plural(dup,'doublon ignoré','doublons ignorés')}`:''}${bad?` · ${bad} ligne(s) sans nom`:''}`);
 };
}

const btn=(act,label,icon,cls='',data='')=>`<button type="button" class="btn ${cls}" data-act="${act}" ${data}>${icon?ico(icon,16):''}<span>${label}</span></button>`;
const head=(view,title,sub,acts='')=>`<section class="banner"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="acts">${acts}</div></section>${D.settings.help&&HELP[view]?`<div class="help">${ico('info',18)}<div><b>À quoi ça sert ?</b> ${HELP[view]}</div></div>`:''}`;

const emptyM=t=>`<div class="empty-m">${t}</div>`;
function table(view,cols,rows,attrs){
 const f=S.f[view],c=cols.find(x=>x.k===f.sort)||cols[0];
 const sorted=[...rows].sort((a,b)=>{const x=c.v(a),y=c.v(b);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'fr'))*f.dir;});
 return `<div class="tblwrap"><table class="tbl"><thead><tr>${cols.map(x=>`<th data-act="sort" data-view="${view}" data-k="${x.k}" class="${x.num?'num':''}" aria-sort="${f.sort===x.k?(f.dir>0?'ascending':'descending'):'none'}">${x.l}${f.sort===x.k?(f.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${sorted.length?sorted.map(r=>`<tr tabindex="0" ${attrs(r)}>${cols.map(x=>`<td class="${x.num?'num':''}">${x.h(r)}</td>`).join('')}</tr>`).join(''):`<tr class="empty"><td colspan="${cols.length}">Aucun résultat. Modifiez la recherche ou les filtres.</td></tr>`}</tbody></table></div>`;
}
const matchQ=(q,parts)=>{if(!q)return true;const h=norm(parts.join(' '));return norm(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w));};
function kpi(l,v,s,color){return `<div class="kpi" style="--kc:${color}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;}
function barsH(items,fmt){const mx=Math.max(1,...items.map(i=>i.v));return `<div class="bars">${items.map(i=>`<div class="bar-r"><span class="bar-l" title="${esc(i.l)}">${esc(i.l)}</span><div class="bar-t"><div class="bar-f" style="width:${i.v?Math.max(2,i.v/mx*100):0}%;background:${i.c||'var(--blue)'}"></div></div><span class="bar-v">${fmt(i.v)}${i.n!=null?` <small>(${i.n})</small>`:''}</span></div>`).join('')}</div>`;}
function actItem(a){
 const t=ACT[a.type]||ACT.note,late=!a.done&&(dayDiff(a.date)<0||(dayDiff(a.date)===0&&a.date<nowISO()));
 const links=[a.contactId&&ct(a.contactId)?ctLink(a.contactId):'',a.dealId&&deal(a.dealId)?link('deal',a.dealId,deal(a.dealId).title):'',a.ticketId&&tk(a.ticketId)?link('ticket',a.ticketId,tk(a.ticketId).number):''].filter(Boolean).join(' · ');
 return `<div class="act ${a.done?'done':''}"><button type="button" class="chk ${a.done?'on':''}" data-act="toggleDone" data-id="${a.id}" aria-label="${a.done?'Marquer comme à faire':'Marquer comme fait'}" aria-pressed="${a.done}">${a.done?ico('check',14):''}</button><span class="aico t-${a.type}">${ico(t.i,15)}</span><div class="act-m" data-act="editAct" data-id="${a.id}"><div class="act-t">${esc(a.subject)}</div><div class="act-s"><span class="${late?'late':''}">${t.l} · ${rel(a.date)}${fmtT(a.date)?' à '+fmtT(a.date):''}</span>${links?' · '+links:''}</div></div>${uav(a.ownerId)}</div>`;
}
function timeline(list){
 if(!list.length)return emptyM('Aucun échange enregistré pour l\'instant.');
 return `<div class="tl">${list.map(a=>{const t=ACT[a.type]||ACT.note;return `<div class="tl-i t-${a.type}" data-act="editAct" data-id="${a.id}"><span class="aico">${ico(t.i,14)}</span><div style="min-width:0"><div class="tl-t">${esc(a.subject)}</div><div class="tl-s">${t.l} · ${fmtDT(a.date)} · ${esc(user(a.ownerId)?.name||'')}</div>${a.description?`<div class="tl-d">${esc(a.description)}</div>`:''}</div></div>`;}).join('')}</div>`;
}

V.dashboard=()=>{

 const wonM=won.filter(d=>{const x=parseD(d.closeDate);return x.getMonth()===now.getMonth()&&x.getFullYear()===now.getFullYear();});
 const open=openDeals(),pipe=sum(open,'amount'),wtd=sum(open,d=>d.amount*d.probability/100);
 const conv=won.length+lost.length?Math.round(100*won.length/(won.length+lost.length)):0;
 const openT=D.tickets.filter(t=>t.status!=='Résolu'),hot=openT.filter(t=>['Haute','Urgente'].includes(t.priority)).length;
 const todo=D.activities.filter(a=>!a.done&&a.type!=='log'&&(all||a.ownerId===u.id)&&dayDiff(a.date)<=0).sort(byDate);
 const closing=open.filter(d=>dayDiff(d.closeDate)<=30&&(all||d.ownerId===u.id)).sort((a,b)=>a.closeDate.localeCompare(b.closeDate)).slice(0,6);

 const h=now.getHours();
 return head('dashboard',`${h<18?'Bonjour':'Bonsoir'} ${esc(u.name.split(' ')[0])}`,`${now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${todo.length?plural(todo.length,'action')+' à traiter aujourd\'hui':'aucune action en attente aujourd\'hui'}`,btn('quick','Créer','plus','primary'))
 +`<div class="kpis">${kpi('CA signé ce mois-ci',eur(sum(wonM,'amount')),plural(wonM.length,'affaire gagnée','affaires gagnées'),'var(--green)')}${kpi('Pipeline en cours',eur(pipe),`Pondéré par la probabilité : ${eur(wtd)}`,'var(--blue)')}${kpi('Taux de transformation',conv+' %',`${won.length} gagnées · ${lost.length} perdues`,'var(--violet)')}${kpi('Tickets ouverts',openT.length,hot?`dont ${plural(hot,'prioritaire')}`:'aucun prioritaire',hot?'var(--bad)':'var(--ok)')}</div>
 <div class="grid2">

  <section class="panel"><div class="panel-h"><h3>Affaires à conclure sous 30 jours</h3><span class="sp"></span><a class="lnk" data-act="nav" data-view="pipeline">Voir le pipeline</a></div><div class="plist">${closing.length?closing.map(d=>`<div class="prow" data-act="open" data-type="deal" data-id="${d.id}"><div style="min-width:0"><b>${esc(d.title)}</b><small>${esc(clientName(d))} · ${stageChip(d.stage)}</small></div><div class="r"><b>${eur(d.amount)}</b><small class="${dayDiff(d.closeDate)<0?'late':''}" style="justify-content:flex-end">${rel(d.closeDate)}</small></div></div>`).join(''):emptyM('Aucune affaire à conclure dans les 30 jours.')}</div></section>
  <section class="panel"><div class="panel-h"><h3>Pipeline par étape</h3></div><div class="pad">${barsH(FLOW.slice(0,4).map(k=>{const L=open.filter(d=>d.stage===k);return {l:stage(k).l,v:sum(L,'amount'),c:stage(k).c,n:L.length};}),eurK)}</div></section>
  <section class="panel"><div class="panel-h"><h3>Dernières actions de l'équipe</h3></div>${timeline(recent)}</section>

  <div class="dbody">
  ${sec('Statut du ticket',`<div class="stepper">${TK_STATUS.map((s,i)=>`<button type="button" class="${t.status===s?'cur':(i<ci?'past':'')}" data-act="tkStatus" data-id="${t.id}" data-status="${s}">${s}</button>`).join('')}</div>`)}
  ${sec('Demande du client',`<div class="pad" style="white-space:pre-wrap">${esc(t.description||'Pas de description.')}</div>`)}
  ${sec('Détails',dl([['Client',k?ctLink(k.id):'—'],['Téléphone',k?esc(k.phone||k.mobile):''],['Email',k?esc(k.email):''],['Canal',esc(t.channel)],['Assigné à',uav(t.ownerId,true)],['Ouvert le',fmtDT(t.createdAt)],['Résolu le',t.resolvedAt?fmtDT(t.resolvedAt):'']]))}
  ${upcomingSec(acts)}
  ${histSec(acts)}
  <div class="dfoot">${btn('editTicket','Modifier','edit','primary',`data-id="${t.id}"`)}</div></div>`;
}
function openDrawer(type,id){S.drawer={type,id};renderDrawer();const dr=$('#drawer');dr.scrollTop=0;setTimeout(()=>{const b=$('#drawer .dclose');if(b)try{b.focus({preventScroll:true});}catch(e){}},20);}
function closeDrawer(){S.drawer=null;$('#drawer').hidden=true;$('#dshade').hidden=true;}
function renderDrawer(){
 if(!S.drawer)return;const {type,id}=S.drawer;
 const obj={contact:ct,company:co,deal,ticket:tk}[type]?.(id);
 if(!obj){closeDrawer();return;}
 const keep=$('#drawer').scrollTop;
 $('#drawer').innerHTML={contact:dContact,company:dCompany,deal:dDeal,ticket:dTicket}[type](obj);
 $('#drawer').hidden=false;$('#dshade').hidden=false;$('#drawer').scrollTop=keep;
}

/* ---------- Navigation ---------- */
const NAV=[
 ['Pilotage'],['dashboard','Tableau de bord','home'],
 ['Relation client'],['contacts','Contacts','user'],['entreprises','Entreprises','building'],['activites','Activités','calendar'],
 ['Ventes'],['pipeline','Pipeline','pipe'],['devis','Devis','file'],['catalogue','Catalogue','box'],
 ['Service client'],['tickets','Tickets SAV','ticket'],
 ['Analyse'],['rapports','Rapports','chart'],['parametres','Paramètres','settings']];
function renderNav(){
 const u=me();
 const lateMine=D.activities.filter(a=>!a.done&&a.type!=='log'&&a.ownerId===u.id&&dayDiff(a.date)<=0).length;
 const openT=D.tickets.filter(t=>t.status!=='Résolu').length;
 const badge={activites:lateMine?`<span class="badge bad" title="À faire aujourd'hui ou en retard">${lateMine}</span>`:'',tickets:openT?`<span class="badge" title="Tickets ouverts">${openT}</span>`:''};
 $('#nav').innerHTML=NAV.map(n=>n.length===1?`<div class="grp">${n[0]}</div>`:`<a data-act="nav" data-view="${n[0]}" class="${S.view===n[0]?'on':''}" ${S.view===n[0]?'aria-current="page"':''} href="#${n[0]}">${ico(n[2])}<span>${n[1]}</span>${badge[n[0]]||''}</a>`).join('');
 $('#meBtn').innerHTML=`${uav(u.id)}<span class="n">${esc(u.name)}</span>`;
}
const FOOT=`<footer class="foot">Support de formation - Chrystelle THEOPHILE - MAJ 11-2026 - Relatia CRM (démonstration) · Entreprise, personnes et données fictives</footer>`;
function renderView(){
 const box=$('#content'),ae=document.activeElement,fid=ae&&ae.id&&box.contains(ae)?ae.id:null;let ss=null;
 if(fid){try{ss=[ae.selectionStart,ae.selectionEnd];}catch(e){}}
 const sc=box.scrollTop;
 box.innerHTML=V[S.view]()+FOOT;box.scrollTop=sc;
 if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(ss&&ss[0]!=null){try{el.setSelectionRange(ss[0],ss[1]);}catch(e){}}}}
 renderNav();
}
function go(v){if(!V[v])v='dashboard';if(S.view!==v){S.view=v;renderView();$('#content').scrollTop=0;}else renderView();try{if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);}catch(e){}$('#side').classList.remove('open');$('#sideShade').hidden=true;}

/* ---------- Actions ---------- */
const QUICK=[['newContact','Contact','user'],['newCompany','Entreprise','building'],['newDeal','Opportunité','trend'],['newActivity','Activité','calendar'],['newQuote','Devis','file'],['newTicket','Ticket SAV','ticket']];
const ACTS={
 nav:d=>go(d.view),
 menu:()=>{const s=$('#side');s.classList.toggle('open');$('#sideShade').hidden=!s.classList.contains('open');},
 open:d=>{$('#gres').hidden=true;$('#qmenu').hidden=true;if(d.type==='quote')return openQuote(d.id);if(d.type==='product')return productForm(d.id);if(d.type==='activity')return activityForm(d.id);openDrawer(d.type,d.id);},
 closeDrawer,closeModal,
 sort:d=>{const f=S.f[d.view];if(f.sort===d.k)f.dir*=-1;else{f.sort=d.k;f.dir=1;}renderView();},
 setF:d=>{const [v,k]=d.path.split('.');S.f[v][k]=d.val;renderView();},
 week:d=>{S.f.activites.week=+d.dir===0?0:S.f.activites.week+(+d.dir);renderView();},
 quick:(d,el)=>{const m=$('#qmenu');if(!m.hidden){m.hidden=true;return;}m.innerHTML=QUICK.map(([a,l,i])=>`<button type="button" data-act="${a}">${ico(i,16)}${l}</button>`).join('');m.hidden=false;const r=el.getBoundingClientRect();m.style.top=(r.bottom+6)+'px';m.style.left=Math.max(8,Math.min(window.innerWidth-238,r.right-230))+'px';},
 newContact:d=>contactForm(null,{companyId:d.company||'',status:'Prospect',civ:'Mme',ownerId:D.settings.currentUser}),
 editContact:d=>contactForm(d.id),
 newCompany:()=>companyForm(null,{ownerId:D.settings.currentUser}),
 editCompany:d=>companyForm(d.id),
 newDeal:d=>dealForm(null,{contactId:d.contact||'',companyId:d.company||''}),
 editDeal:d=>dealForm(d.id),
 newActivity:d=>activityForm(null,d.date?{type:'rdv',date:d.date+'T10:00',done:false,ownerId:D.settings.currentUser}:{type:'appel'}),
 editAct:d=>activityForm(d.id),
 newTicket:d=>ticketForm(null,{contactId:d.contact||''}),
 editTicket:d=>ticketForm(d.id),
 newQuote:d=>openQuote(null,{contactId:d.contact||'',companyId:d.company||'',dealId:d.deal||''}),
 newProduct:()=>productForm(null),
 quickAct:d=>activityForm(null,{type:d.kind,contactId:d.contact||'',companyId:d.company||'',dealId:d.deal||'',ticketId:d.ticket||''}),
 compose:d=>compose({contact:d.contact,deal:d.deal,ticket:d.ticket}),
 toggleDone:d=>{const a=D.activities.find(x=>x.id===d.id);if(!a)return;a.done=!a.done;if(a.done){toast(`Fait : ${a.subject}`);}commit();},
 moveDeal:d=>{const x=deal(d.id);if(!x)return;let k;if(x.stage==='perdu')k='negociation';else k=FLOW[FLOW.indexOf(x.stage)+(+d.dir)];if(k)setStage(x,k);},
 stage:d=>setStage(deal(d.id),d.stage),
 tkStatus:d=>{const t=tk(d.id);if(!t||t.status===d.status)return;const prev=t.status;t.status=d.status;t.resolvedAt=d.status==='Résolu'?nowISO():'';logSys(`Ticket ${t.number} : ${prev} → ${t.status}`,{ticketId:t.id,contactId:t.contactId,companyId:t.companyId});if(d.status==='Résolu')toast(`Ticket ${t.number} résolu`);commit();},
 importCSV,exportCSV,exportJSON,importJSON,
 copy:async d=>{const el=$('#'+d.src);let ok=false;try{await navigator.clipboard.writeText(el.value);ok=true;}catch(e){try{el.focus();el.select();ok=document.execCommand('copy');}catch(e2){}}toast(ok?'Copié dans le presse-papiers':'Copie impossible : sélectionnez le texte et copiez-le avec Ctrl+C.',ok?'ok':'bad');},
 resetDemo:()=>confirmDlg('Recharger les données de démonstration ? Toutes vos saisies seront remplacées.',()=>{D=seed();closeDrawer();commit();toast('Données de démonstration rechargées');},'Recharger'),
 emptyBase:()=>confirmDlg('Vider la base ? Contacts, entreprises, opportunités, activités, devis et tickets seront supprimés.',()=>{Object.assign(D,{contacts:[],companies:[],deals:[],activities:[],quotes:[],tickets:[]});closeDrawer();commit();toast('Base vierge : à vous de jouer !');},'Vider la base')
};
document.addEventListener('click',e=>{
 if(!e.target.closest('#qmenu,[data-act="quick"]'))$('#qmenu').hidden=true;
 if(!e.target.closest('.gsearch'))$('#gres').hidden=true;
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const a=el.dataset.act;if(!ACTS[a])return;
 e.preventDefault();
 if(a!=='quick')$('#qmenu').hidden=true;
 if(el.closest('.layer')&&!['closeModal','copy'].includes(a)&&!el.closest('#qmenu'))return;
 ACTS[a](el.dataset,el,e);
});
$('#modal').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.f){const [v,k]=el.dataset.f.split('.');S.f[v][k]=el.type==='checkbox'?el.checked:el.value;renderView();}
 else if(el.dataset.set){const path=el.dataset.set.split('.');let o=D.settings;while(path.length>1)o=o[path.shift()];o[path[0]]=el.type==='checkbox'?el.checked:el.value;save();renderView();if(el.dataset.set==='currentUser')toast(`Connecté(e) en tant que ${me().name}`);}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#confirm').hidden){$('#confirm').hidden=true;return;}if(!$('#modal').hidden){closeModal();return;}if(!$('#qmenu').hidden){$('#qmenu').hidden=true;return;}if(!$('#gres').hidden){$('#gres').hidden=true;return;}if(S.drawer){closeDrawer();return;}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act],.prow,.mini,.act-m,.tl-i,.wev,.dcard')){e.preventDefault();e.target.click();}
});
/* Glisser-déposer du pipeline */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.dcard');if(!c)return;dragId=c.dataset.deal;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(x){}c.classList.add('dragging');});
document.addEventListener('dragend',()=>{dragId=null;$$('.dcard.dragging').forEach(x=>x.classList.remove('dragging'));$$('.col-b.over').forEach(x=>x.classList.remove('over'));});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();$$('.col-b.over').forEach(x=>{if(x!==z)x.classList.remove('over');});z.classList.add('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!dragId)return;e.preventDefault();const d=deal(dragId);dragId=null;z.classList.remove('over');setStage(d,z.dataset.drop);});
/* Recherche globale */
$('#gsearch').addEventListener('input',e=>{
 const q=e.target.value.trim(),box=$('#gres');if(q.length<2){box.hidden=true;return;}
 const R=[];
 D.contacts.forEach(c=>{if(matchQ(q,[fullName(c),c.email,c.phone,c.mobile,co(c.companyId)?.name]))R.push(['contact',c.id,fullName(c),co(c.companyId)?.name||c.email,'Contact','user']);});
 D.companies.forEach(c=>{if(matchQ(q,[c.name,c.city,c.sector]))R.push(['company',c.id,c.name,c.city,'Entreprise','building']);});
 D.deals.forEach(d=>{if(matchQ(q,[d.title,clientName(d)]))R.push(['deal',d.id,d.title,clientName(d)+' · '+eur(d.amount),'Opportunité','trend']);});
 D.tickets.forEach(t=>{if(matchQ(q,[t.number,t.subject]))R.push(['ticket',t.id,t.number+' · '+t.subject,clientName(t),'Ticket','ticket']);});
 D.quotes.forEach(x=>{if(matchQ(q,[x.number,clientName(x)]))R.push(['quote',x.id,x.number,clientName(x),'Devis','file']);});
 box.innerHTML=R.length?R.slice(0,10).map(r=>`<a data-act="open" data-type="${r[0]}" data-id="${r[1]}" tabindex="0">${ico(r[5],16)}<span><b>${esc(r[2])}</b><br><small class="muted">${esc(r[3]||'')}</small></span><span class="k">${r[4]}</span></a>`).join(''):`<div class="empty-m">Aucun résultat pour « ${esc(q)} »</div>`;
 box.hidden=false;
});
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#gres a');if(a){a.click();e.target.value='';}}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(V[v]&&v!==S.view)go(v);});

/* Démarrage */
const h0=location.hash.slice(1);S.view=V[h0]?h0:'dashboard';
renderView();
})();
</script>
</body>
</html>
